version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noteapp
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/var/www/database
      - storage_data:/var/www/storage/app/public
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    restart: unless-stopped

volumes:
  sqlite_data:
  storage_data:
